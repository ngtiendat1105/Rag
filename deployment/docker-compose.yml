services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in deployment/.env}
      QDRANT__SERVICE__ENABLE_CORS: "false"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.8
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama_data:/root/.ollama
    networks: [private]
    # Remove this reservation when deploying on a CPU-only host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  rag-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ../backend/data_documents:/app/data_documents:ro
      - rag_processed:/app/processed_output
      - huggingface_cache:/home/appuser/.cache/huggingface
    networks: [private]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      rag-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.template:ro
      - ./certbot-www:/var/www/certbot:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    networks: [private]
    command: ["/bin/sh", "-c", "envsubst '$$RAG_DOMAIN' < /etc/nginx/nginx.template > /tmp/nginx.conf && nginx -c /tmp/nginx.conf -g 'daemon off;'"]

networks:
  private:

volumes:
  qdrant_data:
  ollama_data:
  rag_processed:
  huggingface_cache:
