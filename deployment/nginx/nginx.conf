events {}

http {
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
    upstream rag_api { server rag-api:8000; keepalive 32; }

    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name ${RAG_DOMAIN};
        ssl_certificate /etc/letsencrypt/live/${RAG_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${RAG_DOMAIN}/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 2m;

        location / {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://rag_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
