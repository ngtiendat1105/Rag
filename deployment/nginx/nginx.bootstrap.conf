events {}

http {
    server {
        listen 80;
        server_name ${RAG_DOMAIN};
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / {
            proxy_pass http://rag-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
    }
}
